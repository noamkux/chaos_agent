# Index: shown to the agent in the system prompt
name: single-zone
area: resilience
category: single-point-of-failure
summary: >
  All replicas run in one zone, so a zone outage takes the workload down even with
  several replicas.
applies_to: [Deployment, StatefulSet]
max_level: disrupt

# Details: returned only by get_check
default_severity: high
signals: >
  Every pod of the workload is on nodes with the same topology.kubernetes.io/zone label,
  often because of a required node affinity or a nodeSelector on a zone.
proof: >
  Requires Rules of Engagement that allow node drains. Run steady k6 traffic on the user
  journeys. Cordon and drain every node in the zone that holds the replicas, measure
  until the pods are Ready elsewhere or clearly stuck, then uncordon the nodes.
confirmed_when: >
  A user journey fails or breaks its SLO while the zone is drained, or the pods stay
  Pending because they cannot be scheduled in another zone.
survived_when: >
  The pods are rescheduled into other zones and every journey keeps working.
remediation: >
  Remove the zone pinning or allow several zones, and add topologySpreadConstraints on
  topology.kubernetes.io/zone.
