# Index: shown to the agent in the system prompt
name: excessive-pod-permissions
area: exposure
category: misconfiguration
summary: >
  The pod's ServiceAccount holds permissions far beyond what the application needs.
applies_to: [Deployment, StatefulSet, DaemonSet]
max_level: observe

# Details: returned only by get_check
default_severity: high
signals: >
  A mounted ServiceAccount token bound to broad roles: cluster-admin, wildcard verbs or
  resources, read access to Secrets, or write access to workloads.
proof: >
  List the RoleBindings and ClusterRoleBindings for the workload's ServiceAccount and
  read their rules. Never use the token.
confirmed_when: >
  The ServiceAccount can read Secrets, change workloads, or has wildcard rules that the
  application does not need.
survived_when: >
  No token is mounted, or the ServiceAccount has only the permissions the application
  uses.
remediation: >
  Set automountServiceAccountToken false when the app does not call the API, use a
  dedicated ServiceAccount, and grant least privilege.
