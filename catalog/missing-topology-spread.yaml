# Index: shown to the agent in the system prompt
name: missing-topology-spread
area: resilience
category: shared-fate
summary: >
  A workload with several replicas has no spread rules, so its current placement across
  nodes and zones is accidental.
applies_to: [Deployment, StatefulSet]
max_level: observe

# Details: returned only by get_check
default_severity: low
signals: >
  A workload with 2 or more replicas and no topologySpreadConstraints or pod anti-
  affinity.
proof: >
  Read the workload spec and the current placement of its pods. Note that today's spread
  comes from scheduler scoring only and can change on the next restart.
confirmed_when: >
  A workload with 2 or more replicas has no topologySpreadConstraints and no pod anti-
  affinity.
survived_when: Spread rules keep the replicas on different nodes and zones.
remediation: >
  Add topologySpreadConstraints on topology.kubernetes.io/zone and
  kubernetes.io/hostname.
