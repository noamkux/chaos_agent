# Index: shown to the agent in the system prompt
name: best-effort-qos
area: resilience
category: shared-fate
summary: >
  The pod has no resource requests, or requests far below its usage, so it is among the
  first to be evicted or starved when a node is under pressure.
applies_to: [Deployment, StatefulSet]
max_level: observe

# Details: returned only by get_check
default_severity: medium
signals: >
  status.qosClass is BestEffort, or the requests are far below the steady usage measured
  in Prometheus.
proof: >
  Read the pod's QoS class and requests, and compare the requests with its steady CPU
  and memory usage from Prometheus.
confirmed_when: >
  A pod that a journey depends on is BestEffort, or its requests are far below its
  steady usage.
survived_when: Requests are set close to the steady usage.
remediation: Set requests from observed usage, for example from VPA recommendations.
