# Index: shown to the agent in the system prompt
name: insecure-security-context
area: exposure
category: misconfiguration
summary: >
  A container runs as root, privileged or with privilege escalation, so a compromise of
  the app reaches the node more easily.
applies_to: [apps/Deployment, apps/StatefulSet, apps/DaemonSet]
max_level: observe

# Details: returned only by get_check
default_severity: medium
signals: >
  runAsNonRoot not set, privileged: true, allowPrivilegeEscalation not false,
  capabilities not dropped, or a writable root filesystem.
proof: Read the pod and container securityContext.
confirmed_when: A container runs as root, is privileged, or allows privilege escalation.
survived_when: >
  Every container runs as non-root, drops all capabilities and disallows privilege
  escalation.
remediation: >
  Set runAsNonRoot, drop ALL capabilities, set allowPrivilegeEscalation false and
  readOnlyRootFilesystem true, and enforce the restricted Pod Security Standard.
