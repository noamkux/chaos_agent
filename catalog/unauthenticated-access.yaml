# Index: shown to the agent in the system prompt
name: unauthenticated-access
area: exposure
category: misconfiguration
summary: >
  An internal component answers without credentials, so anyone who can reach it can use it.
applies_to: [core/Service]
max_level: probe

# Details: returned only by get_check
default_severity: high
signals: >
  A data store or internal API (Redis, Postgres, Elasticsearch, ...) with no credentials in its
  environment (no PASSWORD-like variable, no secretKeyRef) and no TLS client certificate.
proof: >
  Call connect_check with the handshake that fits the protocol: redis_ping, postgres_startup or
  http. If the protocol is unknown, use banner and tls first. Never send a command that reads or
  writes data. If the only handshake for the protocol does not exercise authentication
  (grpc_health, tcp, banner, tls), report inconclusive with what it showed.
confirmed_when: >
  A handshake that exercises authentication succeeds without credentials: Redis answers PONG,
  Postgres answers AuthenticationOk, or HTTP answers 2xx on an internal component.
survived_when: >
  The component asks for credentials or a client certificate, or refuses the handshake.
remediation: >
  Enable authentication (Redis ACLs or requirepass, Postgres scram-sha-256), require mTLS between
  services, and keep the component behind a NetworkPolicy.
