# Index: shown to the agent in the system prompt
name: secret-in-env
area: exposure
category: misconfiguration
summary: >
  A secret is set as a literal environment value, visible to anyone who can read the
  workload.
applies_to: [apps/Deployment, apps/StatefulSet, apps/DaemonSet]
max_level: observe

# Details: returned only by get_check
default_severity: high
signals: >
  An environment variable with a secret-like name (KEY, SECRET, TOKEN, PASSWORD,
  CREDENTIAL) that has a literal value instead of valueFrom.
proof: >
  Read the names of the environment variables and whether each has a literal value or
  valueFrom. Never read, print or store the value itself.
confirmed_when: A secret-like variable has a literal value in the workload spec.
survived_when: Secret-like variables come from secretKeyRef or an external secret store.
remediation: >
  Move the value to a Secret referenced with secretKeyRef, or to an external secret
  manager, and rotate the exposed secret.
