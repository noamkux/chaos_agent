# Index: shown to the agent in the system prompt
name: slow-recovery
area: resilience
category: excessive-latency
summary: After a pod is lost, the system takes too long to return to its steady state.
applies_to: [Deployment, StatefulSet, DaemonSet]
max_level: disrupt

# Details: returned only by get_check
default_severity: medium
signals: >
  Long startup (large images, heavy runtimes, migrations at start), no startupProbe, or
  a single replica.
proof: >
  Run steady k6 traffic on the journeys. Kill one pod and measure the time from the kill
  until every journey is back to its baseline.
confirmed_when: >
  Recovery takes longer than the profile's recovery target, or longer than 60 seconds
  without a profile.
survived_when: The journeys are back to their baseline within the target.
remediation: >
  Reduce startup time, add a startupProbe, and run enough replicas that the loss of one
  pod does not affect users.
