# Index: shown to the agent in the system prompt
name: missing-pdb
area: resilience
category: single-point-of-failure
summary: >
  No PodDisruptionBudget covers the workload, so a voluntary disruption such as a node
  drain can evict all replicas at once.
applies_to: [apps/Deployment, apps/StatefulSet]
max_level: observe

# Details: returned only by get_check
default_severity: low
signals: >
  No PodDisruptionBudget selects the workload's pods, or the budget allows every pod to
  be unavailable.
proof: >
  List the PodDisruptionBudgets in the namespace and match their selectors to the
  workload's pod labels. Do not drain nodes to prove this check.
confirmed_when: >
  A workload that a user journey depends on has no PodDisruptionBudget, or one that
  allows all its pods to be evicted.
survived_when: >
  A PodDisruptionBudget keeps at least one pod of the workload available during
  voluntary disruptions.
remediation: >
  Add a PodDisruptionBudget with minAvailable 1 (or maxUnavailable 1) for every workload
  with 2 or more replicas.
