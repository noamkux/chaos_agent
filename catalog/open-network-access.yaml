# Index: shown to the agent in the system prompt
name: open-network-access
area: exposure
category: misconfiguration
summary: >
  An internal component can be reached from any namespace in the cluster, so any compromised
  or misconfigured pod can connect to it.
applies_to: [core/Service]
max_level: probe

# Details: returned only by get_check
default_severity: high
signals: >
  No NetworkPolicy in the namespace selects the component's pods (networking.k8s.io/NetworkPolicy
  is not in the inventory, or no policy's podSelector matches the pods' labels).
proof: >
  From the probe server, which runs in its own namespace, call connect_check with handshake tcp
  on each port the Service declares. Send nothing else.
confirmed_when: >
  The connection from the unrelated namespace succeeds, for a component that is not the
  application's entrypoint.
survived_when: The connection is refused or times out.
remediation: >
  Add a default-deny NetworkPolicy with explicit allows for the real callers, and check that the
  cluster's CNI enforces NetworkPolicies.
