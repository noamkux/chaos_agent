# Index: shown to the agent in the system prompt
name: slow-failure
area: resilience
category: excessive-latency
summary: >
  When a dependency is gone, requests block for a long time instead of failing fast.
applies_to: [Deployment, StatefulSet]

# Details: returned only by get_check
max_level: disrupt
default_severity: high
signals: >
  Callers with no client timeout or deadline, or long defaults, on calls to a
  dependency.
proof: >
  Run steady k6 traffic on the journeys. Scale the dependency to 0 and measure the
  latency of the journeys during the first minute, not only their errors. Restore the
  original replica count and wait for the baseline. Report the caller as the component
  and the failed service as the dependency.
confirmed_when: >
  Requests that depend on the missing dependency take longer than the SLO to fail, or
  longer than 5 seconds without a profile.
survived_when: Those requests fail fast or degrade within the SLO.
remediation: >
  Set a timeout or deadline on every call to a dependency, below the journey's SLO, and
  add a circuit breaker.
