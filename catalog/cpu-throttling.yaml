# Index: shown to the agent in the system prompt
name: cpu-throttling
area: performance
category: excessive-load
summary: >
  A CPU limit below what the workload needs under load throttles it, and latency rises
  while the node still has free CPU.
applies_to: [apps/Deployment, apps/StatefulSet, apps/DaemonSet]
max_level: disrupt

# Details: returned only by get_check
default_severity: medium
signals: >
  A CPU limit close to or below the steady usage, or
  container_cpu_cfs_throttled_periods_total rising.
proof: >
  Ramp k6 load in steps up to the profile's peak, within the Rules of Engagement RPS
  cap. At each step measure the journeys' p95, the container's throttled periods and the
  node's CPU usage.
confirmed_when: >
  A journey breaks its SLO while throttled periods rise and the node's CPU is not
  saturated.
survived_when: No SLO break, or no throttling at the load where the SLO breaks.
remediation: >
  Raise or remove the CPU limit and keep a CPU request based on observed usage.
