# One PDB per stateless service: a drain or an autoscaler takes at most one pod of each at a time.
# Labeled so they can be deleted when the lab goes back to lab/apps/boutique.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: adservice
  labels:
    chaos-lab/hardened: "true"
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: adservice
---
