# Rules of Engagement: what the agent may do in a run. Written by security or operations,
# separate from target.yaml (the application team) and from the agent's code.
scope:
  namespaces: [boutique]

# Highest action level for runs with these rules: observe, probe or disrupt.
max_level: disrupt

# Journeys marked writes: true in target.yaml (cart, checkout) create data. Allowed in the lab only.
allow_write_journeys: true

# Draining a node evicts every pod on it, from every namespace. Allowed in the lab only.
allow_node_actions: true

# Workloads the agent may measure but never change or restart. For state that is not persisted:
# redis-cart keeps every cart on an emptyDir, so one restart deletes all of them.
protected_workloads: [redis-cart]

# Limits per run.
max_experiments: 15
max_restore_after_s: 120

# What the agent may never change, on top of what the disrupt server always refuses (Secrets,
# PersistentVolumeClaims, ServiceAccounts and RBAC). Required: write deny: [] to deny nothing more.
# An entry is an API group, which also covers its subgroups (fluxcd.io covers
# kustomize.toolkit.fluxcd.io), or one group/Kind (argoproj.io/Application).
# Deny what a controller acts on outside the namespace or the cluster, where restoring the object
# does not undo what the controller did: GitOps, cloud resources, backups, database operators.
deny:
  # Argo CD, which can prune whole applications. Argo Rollouts (argoproj.io/Rollout) stay open:
  # a Rollout is restored from its snapshot like a Deployment.
  - argoproj.io/Application
  - argoproj.io/ApplicationSet
  - argoproj.io/AppProject
  - fluxcd.io
  - services.k8s.aws
  - crossplane.io
  - upbound.io
  - cnrm.cloud.google.com
  - azure.com
  - velero.io
  - cnpg.io
