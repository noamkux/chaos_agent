# W4 secret-in-env: an API key as a literal env value instead of a Secret reference.
# The value is fake on purpose and doubles as a canary: it must never appear in reports or the DB.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: PAYMENT_GATEWAY_API_KEY
              value: lab-fake-7f3c9a2e5b8d41f6
