postgresql:
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

mcp:
  image:
    tag: dev
  allowedNamespaces: [boutique]
  levels:
    disrupt:
      enabled: true
      # The lab tests node and zone failures; the chaos agent runs on the control-plane, out of reach.
      nodeActions: whole_node
  nodeSelector:
    node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
