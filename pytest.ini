# Unit tests for the deterministic parts: python -m pytest from the repository root.
# The scripts beside them in tests/ (try_*.py, smoke_test.py) need a cluster or Postgres and are not
# collected: only tests/unit/ is.
[pytest]
pythonpath = orchestrator servers/mcp
testpaths = orchestrator/tests/unit servers/mcp/tests/unit
# Only test_*.py, from any path given: smoke_test.py matches pytest's default *_test.py and would
# connect to Postgres the moment it is imported.
python_files = test_*.py
