{{- /* The agent (ADR-0039): a CronJob whose Jobs are runs, with no access to the cluster's API at all.
It reaches the cluster only through the MCP servers, Postgres through its Service, and Claude through
the API key from a Secret the customer made. */ -}}
{{- if .Values.orchestrator.enabled }}
{{- $o := .Values.orchestrator }}
{{- $tag := required "orchestrator.image.tag is required" $o.image.tag }}
{{- if not (has $o.namespace .Values.mcp.allowedNamespaces) }}
{{- fail "orchestrator.namespace must be one of mcp.allowedNamespaces" }}
{{- end }}
{{- $inputs := required "orchestrator.inputsConfigMap is required: a ConfigMap with roe.yaml and target.yaml" $o.inputsConfigMap }}
{{- $secret := required "orchestrator.anthropic.existingSecret is required: a Secret with the Anthropic API key" $o.anthropic.existingSecret }}
{{- if not .Values.mcp.levels.observe.enabled }}
{{- fail "orchestrator needs mcp.levels.observe.enabled: every run starts from discovery" }}
{{- end }}
{{- if not .Values.postgresql.enabled }}
{{- fail "orchestrator needs postgresql.enabled: runs, steps, undos and knowledge are stored there" }}
{{- end }}
{{- $name := printf "%s-orchestrator" .Release.Name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
# No token in the pod: the orchestrator never talks to the Kubernetes API (ADR-0008).
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: orchestrator
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # A CronJob needs a schedule even when suspended; without one set, it never fires on its own.
  schedule: {{ $o.schedule | default "@yearly" | quote }}
  suspend: {{ empty $o.schedule }}
  # One run per namespace at a time: the database lock refuses a second one anyway.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed run is not retried: a retry would run experiments again on its own.
      backoffLimit: 0
      activeDeadlineSeconds: {{ $o.activeDeadlineSeconds }}
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: orchestrator
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ $name }}
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          {{- with $o.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $o.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          containers:
            - name: orchestrator
              image: "{{ $o.image.repository }}:{{ $tag }}"
              imagePullPolicy: {{ $o.image.pullPolicy }}
              env:
                - name: TARGET_NAMESPACE
                  value: {{ $o.namespace | quote }}
                - name: CHAOS_MODEL
                  value: {{ $o.model | quote }}
                - name: ROE_FILE
                  value: /etc/chaos-agent/roe.yaml
                - name: TARGET_FILE
                  value: /etc/chaos-agent/target.yaml
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ $secret }}
                      key: {{ $o.anthropic.key }}
                - name: PGHOST
                  value: {{ include "chaos-agent.postgresql.fullname" . }}
                - name: PGPORT
                  value: "5432"
                - name: PGDATABASE
                  value: {{ .Values.postgresql.auth.database | quote }}
                - name: PGUSER
                  value: {{ .Values.postgresql.auth.username | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "chaos-agent.postgresql.secretName" . }}
                      key: password
                {{- range $level, $config := .Values.mcp.levels }}
                {{- if $config.enabled }}
                - name: MCP_{{ upper $level }}_URL
                  value: "http://{{ include "chaos-agent.mcp.fullname" (list $ $level) }}:{{ $.Values.mcp.port }}/mcp"
                {{- end }}
                {{- end }}
                # Nothing writes to the image; libraries that want a home or a temp dir get /tmp.
                - name: HOME
                  value: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                {{- toYaml $o.resources | nindent 16 }}
              volumeMounts:
                - name: inputs
                  mountPath: /etc/chaos-agent
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: inputs
              configMap:
                name: {{ $inputs }}
                items:
                  - key: roe.yaml
                    path: roe.yaml
                  - key: target.yaml
                    path: target.yaml
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
{{- end }}
