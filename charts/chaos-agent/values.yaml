postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: 0.8.7-pg17
  auth:
    database: chaos
    username: chaos
    existingSecret: ""
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []

mcp:
  image:
    repository: chaos-agent-mcp
    tag: ""
    pullPolicy: IfNotPresent
  # Namespaces the MCP servers may read and act on. Required: the servers refuse every other namespace.
  allowedNamespaces: []
  port: 8081
  levels:
    observe:
      enabled: false
    probe:
      enabled: true
      # Caps on every measurement, whatever an application's target.yaml asks for.
      limits:
        longestK6RunS: 300 # the longest single run of k6, in seconds
        longestRequestWaitS: 30 # the most fail_request_after_s may be
        maxNewUsersPerSecond: 10 # per journey
        maxConcurrentUsersPerJourney: 50 # users in flight at once, per journey
    disrupt:
      enabled: false
      # Node and zone failures. none; scope_only: cordon a node and evict only the pods in
      # allowedNamespaces; whole_node: evict every pod on the node, and the lost-node taint, which
      # reaches every namespace. Anything but none grants get and patch on nodes cluster-wide; the
      # admission policy allows only spec.unschedulable and chaos-agent.io/ taints to change.
      nodeActions: none
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []

# The agent itself. One run is one Job, made from a CronJob that stays suspended unless schedule is set:
#   kubectl -n <release namespace> create job --from=cronjob/<release>-orchestrator run-$(date +%s)
orchestrator:
  enabled: false
  image:
    repository: chaos-agent-orchestrator
    tag: ""
    pullPolicy: IfNotPresent
  model: claude-sonnet-5-5
  # The namespace of the application under test: one of mcp.allowedNamespaces and of the RoE's scope.
  namespace: ""
  # A ConfigMap with two keys, roe.yaml and target.yaml, made from files kept in git, for example:
  #   kubectl create configmap shop-inputs --from-file=roe.yaml --from-file=target.yaml
  inputsConfigMap: ""
  # The Anthropic API key, from a Secret made outside the chart (by hand, External Secrets, Vault...),
  # so the key is never in these values or in Helm's release history.
  anthropic:
    existingSecret: ""
    key: api-key
  # Empty: runs only when a Job is created by hand. A cron expression: runs on that schedule.
  schedule: ""
  # Kubernetes stops a run after this; the run is marked aborted, and its undos run at the next start.
  activeDeadlineSeconds: 3600
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  nodeSelector: {}
  tolerations: []

# Grafana (ADR-0040). The chart does not run Grafana: it ships its dashboard and a datasource for its
# own Postgres as objects in the release namespace, which the Grafana chart's sidecar loads when it
# watches this namespace (sidecar.dashboards and sidecar.datasources, with searchNamespace).
grafana:
  dashboard:
    enabled: false
    # The label the sidecar looks for: the Grafana chart's sidecar.dashboards.label and labelValue.
    labels:
      grafana_dashboard: "1"
    # The Grafana folder, read by the sidecar's folderAnnotation (grafana_folder).
    folder: Chaos Agent
  # A Secret, not a ConfigMap: it holds the Postgres password. It is rendered only once the Postgres
  # Secret exists (lookup), so the first install of a new release needs one more helm upgrade.
  datasource:
    enabled: false
    labels:
      grafana_datasource: "1"
