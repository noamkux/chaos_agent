postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: 0.8.7-pg17
  auth:
    database: chaos
    username: chaos
    existingSecret: ""
  storage:
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []

mcp:
  image:
    repository: chaos-agent-mcp
    tag: ""
    pullPolicy: IfNotPresent
  # Namespaces the MCP servers may read and act on. Required: the servers refuse every other namespace.
  allowedNamespaces: []
  port: 8081
  levels:
    observe:
      enabled: false
    probe:
      enabled: true
      # Caps on every measurement, whatever an application's target.yaml asks for.
      limits:
        longestK6RunS: 300 # the longest single run of k6, in seconds
        longestRequestWaitS: 30 # the most fail_request_after_s may be
        maxNewUsersPerSecond: 10 # per journey
        maxConcurrentUsersPerJourney: 50 # users in flight at once, per journey
    disrupt:
      enabled: false
      # Node and zone failures. none; scope_only: cordon a node and evict only the pods in
      # allowedNamespaces; whole_node: evict every pod on the node, and the lost-node taint, which
      # reaches every namespace. Anything but none grants get and patch on nodes cluster-wide; the
      # admission policy allows only spec.unschedulable and chaos-agent.io/ taints to change.
      nodeActions: none
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
