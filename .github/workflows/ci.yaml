# Checks every change to the agent: lint and unit tests (the chart and the image come next).
name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
            - run: pip install ruff==0.17.6
            - run: ruff check --select F --output-format github orchestrator servers/mcp

    test:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: |
                      orchestrator/requirements.txt
                      servers/mcp/requirements.txt
            - run: pip install --require-hashes -r servers/mcp/requirements.txt
            - run: pip install -r orchestrator/requirements.txt pytest==9.2.0
            - run: python -m pytest -q
