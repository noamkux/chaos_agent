# Checks every change to the agent: lint, unit tests and the Helm chart (the image comes next).
name: ci

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.15"
            - run: pip install ruff==0.17.6
            - run: ruff check --select F --output-format github orchestrator servers/mcp

    # Each part is tested on the Python it runs on: the MCP servers on the image's 3.15, the
    # orchestrator on 3.14 (onnxruntime, under fastembed, has no 3.15 wheel yet).
    test-servers:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.15"
                  cache: pip
                  cache-dependency-path: servers/mcp/requirements.txt
            - run: pip install --require-hashes -r servers/mcp/requirements.txt
            - run: pip install pytest==9.2.0
            - run: python -m pytest -q servers/mcp/tests/unit

    test-orchestrator:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: orchestrator/requirements.txt
            - run: pip install -r orchestrator/requirements.txt pytest==9.2.0
            - run: python -m pytest -q orchestrator/tests/unit

    chart:
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
              with:
                  version: v4.3.2
            - name: Install kubeconform
              run: |
                  curl -fsSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
                  echo "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tar.gz" | sha256sum --check
                  tar -xzf kubeconform.tar.gz -C /usr/local/bin kubeconform
            - name: Lint
              run: helm lint --strict charts/chaos-agent -f charts/chaos-agent/ci/all-levels-values.yaml
            - name: Render and validate the manifests
              run: |
                  helm template ci charts/chaos-agent -f charts/chaos-agent/ci/all-levels-values.yaml \
                      | kubeconform -strict -summary -output text
            - name: The chart refuses unsafe values
              run: |
                  refused() {
                      local expected="$1"; shift
                      if helm template ci charts/chaos-agent "$@" > /dev/null 2> refused.err; then
                          echo "::error::the chart rendered, expected it to fail with: $expected"
                          return 1
                      fi
                      if ! grep -q "$expected" refused.err; then
                          echo "::error::the chart failed for another reason, expected: $expected"
                          cat refused.err
                          return 1
                      fi
                  }
                  refused "mcp.allowedNamespaces is required" --set mcp.image.tag=ci
                  refused "mcp.image.tag is required" --set "mcp.allowedNamespaces={shop}"
                  refused "nodeActions must be none, scope_only or whole_node" \
                      --set mcp.image.tag=ci --set "mcp.allowedNamespaces={shop}" \
                      --set mcp.levels.disrupt.enabled=true --set mcp.levels.disrupt.nodeActions=off
                  refused "orchestrator.namespace must be one of mcp.allowedNamespaces" \
                      -f charts/chaos-agent/ci/all-levels-values.yaml --set orchestrator.namespace=kube-system
                  refused "orchestrator.anthropic.existingSecret is required" \
                      -f charts/chaos-agent/ci/all-levels-values.yaml --set orchestrator.anthropic.existingSecret=
            - id: kind
              uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
              with:
                  cluster_name: chaos-ci
            - name: Build the MCP image and load it into kind
              run: |
                  docker build -t chaos-agent-mcp:ci servers/mcp
                  kind load docker-image chaos-agent-mcp:ci --name chaos-ci
            - name: Install
              run: |
                  kubectl create namespace shop
                  kubectl create namespace pay
                  helm install ci charts/chaos-agent -f charts/chaos-agent/ci/all-levels-values.yaml \
                      --namespace chaos-system --create-namespace --wait --timeout 5m
            - name: The observe server may read what inspect_workload needs
              run: |
                  for resource in pods replicasets.apps events; do
                      kubectl auth can-i list "$resource" -n shop --as=system:serviceaccount:chaos-system:ci-mcp-observe
                  done
            - name: The API server type-checks every admission policy without warnings
              run: |
                  kubectl wait validatingadmissionpolicy --all \
                      --for=jsonpath='{.status.observedGeneration}'=1 --timeout=60s
                  kubectl get validatingadmissionpolicy -o json \
                      | jq -e '[.items[].status.typeChecking.expressionWarnings // [] | length] | add == 0'
            - name: Show what failed
              if: failure() && steps.kind.outcome == 'success'
              run: |
                  kubectl get pods -A
                  kubectl get events -n chaos-system --sort-by=.lastTimestamp
                  kubectl get validatingadmissionpolicy -o yaml

    image:
        needs: [lint, test-servers, test-orchestrator, chart]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
            id-token: write
            attestations: write
        env:
            IMAGE_NAME: ghcr.io/noamkux/chaos-agent-mcp
            IMAGE: ghcr.io/noamkux/chaos-agent-mcp:sha-${{ github.sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Build
              run: docker build -t "$IMAGE" servers/mcp
            - name: Scan for fixable HIGH and CRITICAL vulnerabilities
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              with:
                  version: v0.76.2
                  image-ref: ${{ env.IMAGE }}
                  severity: HIGH,CRITICAL
                  ignore-unfixed: true
                  exit-code: "1"
            - name: Push to GHCR
              id: push
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  docker push "$IMAGE"
                  digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" | cut -d@ -f2)
                  echo "digest=$digest" >> "$GITHUB_OUTPUT"
                  echo "Pushed \`$IMAGE_NAME@$digest\`" >> "$GITHUB_STEP_SUMMARY"
            - name: Generate the SBOM
              if: steps.push.outcome == 'success'
              uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
              with:
                  version: v0.76.2
                  image-ref: ${{ env.IMAGE }}
                  format: spdx-json
                  output: sbom.spdx.json
            - name: Attest build provenance
              if: steps.push.outcome == 'success'
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.push.outputs.digest }}
                  push-to-registry: true
            - name: Attest the SBOM
              if: steps.push.outcome == 'success'
              uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
              with:
                  subject-name: ${{ env.IMAGE_NAME }}
                  subject-digest: ${{ steps.push.outputs.digest }}
                  sbom-path: sbom.spdx.json
                  push-to-registry: true
            - name: Log out of GHCR
              if: always() && steps.push.outcome != 'skipped'
              run: docker logout ghcr.io
